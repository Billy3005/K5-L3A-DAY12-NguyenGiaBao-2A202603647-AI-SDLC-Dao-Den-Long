<!doctype html>
<html lang="vi">
<head>

  <title>Đảo Đèn Lồng</title>
  <style>

    #overlay h1 { font-size: 44px; margin: 0 0 12px; color: #ffb347; }

  <div id="overlay"><h1 id="title"></h1><div id="detail"></div><div style="margin-top:16px;font-size:16px">Nhấn <b>R</b> để chơi lại</div></div>
  <script type="module" src="/src/render/main.ts"></script>
